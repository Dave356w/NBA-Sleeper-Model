[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sleeper-nba-model"
version = "1.22.0"
description = "Independent Sleeper-only NBA forecasts and immutable forward evaluation"
requires-python = ">=3.12"
dependencies = ["numpy>=2,<3", "scipy>=1.14,<2", "httpx>=0.27,<1", "PyYAML>=6,<7", "jinja2>=3.1,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
browser = ["playwright>=1.48,<2"]

[project.scripts]
sleeper-nba = "sleeper_nba.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
