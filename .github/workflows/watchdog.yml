name: Watcher watchdog
# Starts the lock watcher when none is running. The watcher normally hands off
# to itself; this only repairs a broken chain, so late or skipped cron
# deliveries cost at most a delayed restart.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  ensure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Start the watcher if it is not running
        run: |
          set -eu
          active=0
          for status in in_progress queued pending waiting requested; do
            count=$(gh api "repos/$GH_REPO/actions/workflows/watch.yml/runs?status=$status&per_page=1" --jq '.total_count')
            active=$(( active + count ))
          done
          if [ "$active" -eq 0 ]; then
            gh workflow run watch.yml --ref main
            echo "No watcher was running; started one."
          else
            echo "Watcher already active ($active run(s))."
          fi
      - name: Alert when capture has stalled
        # Every watcher run commits data/live_previews.json (it carries a fresh updated_at), so a
        # long gap means no capture is happening even if a run looks active. A failed scheduled
        # run notifies the repository owner.
        env:
          STALL_HOURS: '3'
        run: |
          set -eu
          last=$(gh api "repos/$GH_REPO/commits?sha=main&path=data/live_previews.json&per_page=1" --jq '.[0].commit.committer.date')
          age=$(( $(date -u +%s) - $(date -u -d "$last" +%s) ))
          echo "Last capture commit: $last (${age}s ago)"
          failed=$(gh api "repos/$GH_REPO/actions/workflows/watch.yml/runs?status=completed&per_page=2" --jq '[.workflow_runs[].conclusion] | map(select(. == "failure")) | length')
          if [ "$age" -gt $(( STALL_HOURS * 3600 )) ]; then
            echo "::error::No watcher capture committed for more than ${STALL_HOURS}h (last $last)."
            exit 1
          fi
          if [ "$failed" -ge 2 ]; then
            echo "::error::The last two completed watcher runs failed; check the watch workflow."
            exit 1
          fi
