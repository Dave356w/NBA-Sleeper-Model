name: Capture, grade, calibrate and publish
on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: sleeper-model-writer
  cancel-in-progress: false
jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      captured: ${{ steps.run.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Capture and persist model records
        id: run
        run: python -m sleeper_nba run
      - name: Persist accepted data even if reporting failed
        if: always()
        run: |
          git config user.name 'sleeper-model[bot]'
          git config user.email 'sleeper-model[bot]@users.noreply.github.com'
          git add data model research/output
          if ! git diff --cached --quiet; then
            git commit -m 'Record Sleeper forecasts, grades and calibration'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Configure Pages
        if: steps.run.outcome == 'success'
        uses: actions/configure-pages@v5
      - name: Upload website
        if: steps.run.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Upload recovery audit copy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-records-${{ github.run_id }}
          path: |
            data/transactions
            model
          retention-days: 30
  publish:
    needs: model
    if: needs.model.outputs.captured == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
