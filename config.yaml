methodology: sleeper_only_v1_33
sleeper_company: rotowire
wp_initial: 13.3
# v1.33 (owner update, 20 November 2026): the adaptive win-probability scale starts at 13.3 and is
# shrunk toward 13.3 instead of 10 (NBA Matchups' fitted margin sigma). Without the key it is 10.
wp_prior_centre: 13.3
ats_bias_initial: 0.0
ats_sigma_initial: 14.0
totals_bias_initial: 0.0
totals_sigma_initial: 19.0
half_life: 75
prior_strength: 100
minimum_games: 30
wp_bounds: [6.0, 20.0]
ats_bias_bounds: [-15.0, 15.0]
ats_sigma_bounds: [5.0, 35.0]
totals_bias_bounds: [-25.0, 25.0]
totals_sigma_bounds: [7.0, 45.0]
daily_scale_movement: 0.10
daily_bias_movement: 1.0
team_minutes_bounds: [200.0, 280.0]
# v1.29 (owner update, 19 November 2026): on-time lock in the 15 minutes after T-5h; if that
# window passes with no valid capture, the first valid capture until T-2h is a labelled late lock.
lock_policy: five_hours_late_v3
lock_late_hours: 2
# v1.26 (owner update, 19 November 2026): the first snapshot waits for the game's Eastern date.
# v1.27: it also waits for a qualifying DraftKings moneyline, freezing unpriced from T-5h.
first_policy: game_day_priced_et_v1
# v1.27 (owner update, 19 November 2026): season-record games whose frozen snapshot has no
# price use the ESPN DraftKings close (reporting only; research/build_closing_backfill.py).
closing_backfill:
  file: data/market_backfill/espn_draftkings_close_2026-27.json
  sha256: e84d7160d677f113a34131cb83772e56daf66e7092f038bbd539b413398f7ee9
# v1.30 (owner update, 19 November 2026): the season replay (public record and confidence
# history) uses only snapshots captured on the game's Eastern date. A game-day native lock stands
# in for an earlier-day first snapshot; a game with no game-day capture is excluded and listed.
replay_snapshot: game_day_et_v1
lock_hours: 5
lock_tolerance_minutes: 15
market_max_age_minutes: 15
market_pair_minutes: 5
market_clock_tolerance_seconds: 60
price_bounds: [-135, 115]
ats_subset_points: 3.0
value_probability_edge: 0.05
# Markets that create tracked selections. Spread and totals are context only.
selection_markets: [moneyline]
# v1.27 (owner update, 19 November 2026): the value series is retired; only model picks register.
selection_series: [directional]
book: draftkings

# v1.24: confidence calibration starts from the season's walk-forward replay
# plus live games, and locks are scored with the first-stage calibration.
calibration:
  history: season
  stage_source: {lock: first}

# Team residual decay is calendar time, distinct from confidence calibration.
learn_scalar_biases: false
matchup:
  enabled: true
  half_life_days: 25.0
  # v1.23: correct from the first graded game; the priors do the shrinking.
  minimum_games: 1
  # v1.23: locks score with the first-stage fit instead of a lock-only history.
  stage_source: {lock: first}
  # v1.23: refit once each slate is fully graded, not once per UTC day.
  refit: slate
  # v1.25 (owner update, 19 November 2026): apply the fitted offense terms; defense prior 40 -> 20.
  defense_prior: 20.0
  offense_prior: 20.0
  apply_offense: true
  # v1.28 (owner update, 19 November 2026): a game with several native first snapshots trains on
  # its latest one (nearest tip, game-day when available), as the season replay already does.
  # v1.31 (owner update, 19 November 2026): only game-day snapshots train the fit, as in the v1.30
  # replay; a game-day lock stands in for an earlier-day first snapshot, and a game with no
  # game-day capture is left out.
  history_snapshot: game_day_latest
  # v1.32 (owner update, 19 November 2026): a team whose Sleeper projected minutes exceed a full
  # game is scaled down to 240 minutes before the team terms (never scaled up). Raw scores and the
  # fixed control are unchanged. Seed and backfill minutes come from the pinned file below
  # (research/build_seed_minutes.py).
  team_minutes_cap: 240.0
  seed_minutes:
    file: data/calibration_seeds/seed_team_minutes_2026-27.json
    sha256: 3f6b5926457190812a510c4d144843a471374c82c30631087eb83b1b298dea77
  global_prior: 100.0
  venue_prior: 100.0
  coefficient_bound: 30.0
  seed_season: 2026
  seed_file: data/calibration_seeds/legacy_first_2026-27.json
  seed_sha256: 9d3a8e56998a4a7e738020614b3546e1afbc658d97370abe7cffe53714348705
  # Owner update, 17 November 2026: games missed in the 14-17 November capture outage, backfilled
  # from nba-matchups' archived early-day Sleeper snapshots (research/build_gap_backfill.py).
  backfill_files:
    - file: data/calibration_seeds/gap_backfill_2026-11-17.json
      sha256: 39e68bffb5ac6943bceb052026961b58f632e6f59dfb2c77811f2a6f93ddad90
